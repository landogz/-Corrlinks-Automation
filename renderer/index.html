<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inmate Exchange Auto</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>CorrLinks Auto</h1>
        <p class="sub">SportsData login → inmate accounts → CorrLinks compose</p>
      </header>

      <section class="card">
        <h2>SportsData login</h2>
        <form id="sportsdataForm" class="form" autocomplete="on">
          <label for="sdBaseUrl">Base URL</label>
          <input
            id="sdBaseUrl"
            name="sportsdata-base-url"
            type="url"
            value="https://sportsdata.com"
            autocomplete="url"
          />

          <label for="sdEmail">Email</label>
          <input
            id="sdEmail"
            name="sportsdata-email"
            type="email"
            placeholder="operator@example.com"
            autocomplete="username"
            required
          />

          <label for="sdPassword">Password</label>
          <input
            id="sdPassword"
            name="sportsdata-password"
            type="password"
            placeholder="SportsData password"
            autocomplete="current-password"
            required
          />

          <label class="check">
            <input id="sdRemember" type="checkbox" checked />
            Remember email and password on this computer
          </label>

          <div class="row">
            <button id="btnSaveLogin" type="submit">Save login</button>
            <button id="btnRefresh" type="button" class="ghost">Refresh inmates</button>
          </div>
        </form>
        <p id="configSummary" class="muted">Loading config…</p>
      </section>

      <section class="card">
        <h2>Inmate</h2>
        <label for="accountSelect">Inmate account</label>
        <select id="accountSelect" disabled>
          <option value="">Load inmates first</option>
        </select>
        <p id="accountMeta" class="muted"></p>
        <div class="row">
          <button id="btnLogin" type="button" disabled>Login to CorrLinks</button>
          <button id="btnStatus" type="button" class="ghost">Check status</button>
        </div>
      </section>

      <section class="card">
        <h2>Status log</h2>
        <pre id="log" class="log"></pre>
      </section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
